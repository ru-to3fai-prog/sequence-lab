 <body><main id="main"><header><a href="index.html">数列の公式 トップ</a><h1 id="title" class="lesson-title"></h1><p>公式と代入した式を見比べ、括弧・掛け算・累乗の範囲を確かめましょう。</p></header>

<section class="step-card" id="problem"><strong>今回の問題</strong> <span id="counter"></span><div class="condition" id="condition"></div></section>
<section class="step-card" id="step1" hidden><h2>① 使用する公式</h2><div class="math-scroll" id="formula"></div><p id="legend"></p><p id="formula-reason"></p></section>
<section class="step-card" id="step2" hidden><h2>② 数値を代入</h2><div class="math-scroll" id="substitute"></div></section>
<section class="step-card" id="step3" hidden><h2>③ 式の書き方</h2><div class="math-scroll" id="highlight"></div><div class="notes" id="explanation"></div><section id="quiz" hidden><h2>確認問題：正しい式はどちら？</h2><div class="quiz-options" id="choices"></div><div id="quiz-feedback" aria-live="polite"></div></section><p>括弧の種類より、囲む範囲が大切です。中括弧は内側の括弧と区別するために使います。</p></section>
<section class="step-card" id="step4" hidden><h2>④ 計算した答え</h2><div class="math-scroll" id="answer"></div></section>
<nav class="toolbar"><button class="primary" id="advance">解説を進める</button><button id="next">次の問題</button></nav></main><script>
const TYPE='arithmeticSum';
const META={arithmeticTerm:{name:'等差数列の一般項',symbol:'a',form:'a<sub>n</sub> = a + (n − 1)d'},arithmeticSum:{name:'等差数列の和',symbol:'S',form:'S<sub>n</sub> = '+frac('n{2a + (n − 1)d}','2')},geometricTerm:{name:'等比数列の一般項',symbol:'a',form:'a<sub>n</sub> = ar<sup>n − 1</sup>'}};
const meta=META[TYPE],isGeom=TYPE==='geometricTerm',isSum=TYPE==='arithmeticSum';
const $=id=>document.getElementById(id), math=t=>`<span class="math">${t}</span>`;
function gcd(a,b){while(b)[a,b]=[b,a%b];return Math.abs(a)||1}
function rat(p,q=1){if(q<0){p=-p;q=-q}let g=gcd(p,q);return {p:p/g,q:q/g}}
function add(a,b){return rat(a.p*b.q+b.p*a.q,a.q*b.q)}
function mul(a,b){return rat(a.p*b.p,a.q*b.q)}
function frac(a,b){return `<span class="frac"><span class="top">${a}</span><span class="bottom">${b}</span></span>`}
function num(v){if(typeof v==='number')v=rat(v);return v.q===1?String(v.p).replace('-','−'):(v.p<0?'−':'')+frac(Math.abs(v.p),v.q)}
function grouped(v){return v.p<0||v.q!==1?`(${num(v)})`:num(v)}
function marked(t,k){return `<span class="focus-piece${stage===3&&focus===k?' active':''}">${t}</span>`}
function factor(v){return v.p<0||v.q!==1?`(${num(v)})`:num(v)}
function polynomial(c,b){let out=c.p===0?'':(c.p===c.q?'':c.p===-c.q?'−':num(c))+'n';if(b.p!==0)out+=(out?(b.p<0?' − ':' + '):(b.p<0?'−':''))+num(rat(Math.abs(b.p),b.q));return out||'0'}
const source=[];
if(isGeom){for(const [p,q] of [[2,1],[-2,1],[1,2],[-1,2],[3,1],[-2,3],[1,1]])for(const n of [4,5,null])source.push({a:[3,2,4][source.length%3],v:rat(p,q),n});}
else{for(const [p,q] of [[2,1],[-2,1],[3,1],[-3,1],[1,2],[-1,2],[0,1]])for(const n of [4,6,null])source.push({a:[3,5,2][source.length%3],v:rat(p,q),n});}
if(isSum){const lastProblems=source.filter(x=>x.n!==null&&x.v.q===1).map(x=>({...x,given:'last'}));source.push(...lastProblems);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let deck=[],position=0,stage=0,focus=0,mode=0,selection=null,choiceData=null,revision=0,inputRevision=0;
function newDeck(previous){do{deck=shuffle(source)}while(deck.some((x,i)=>isGeom&&x.v.p===x.v.q&&(i?deck[i-1].v.p===deck[i-1].v.q:previous?.v.p===previous?.v.q))||deck[0]===previous);position=0}
newDeck();
function eq(x){return `${meta.symbol}<sub>${x.n??'n'}</sub>`}
function nth(x){return add(rat(x.a),mul(rat(x.n-1),x.v))}
function resultValue(x){if(isGeom)return mul(rat(x.a),rat(x.v.p**(x.n-1),x.v.q**(x.n-1)));if(isSum)return mul(rat(x.n,2),add(rat(x.a),nth(x)));return nth(x)}
function official(){if(isSum&&mode===1)return 'S<sub>n</sub> = '+frac('n(a + l)','2');return meta.form}
function substitute(x,highlight=false){const m=(t,k)=>highlight?marked(t,k):t,n=x.n??'n',nm=x.n===null?'n − 1':`${n} − 1`;
 if(isGeom)return eq(x)+' = '+m(String(x.a),3)+' × '+m(m(grouped(x.v),0)+`<sup>${m(nm,1)}</sup>`,2);
 if(isSum&&mode===1){const last=nth(x),lastText=grouped(last);return eq(x)+' = '+frac(m(n,3)+m(`{${m(String(x.a),0)} + ${m(lastText,1)}}`,2),'2');}
 const term=m(`(${m(nm,0)}) × ${m(grouped(x.v),1)}`,2);
 const inside=isSum?`${2} × ${x.a} + ${term}`:`${x.a} + ${term}`;
 return eq(x)+' = '+(isSum?frac(m(n,3)+`{${inside}}`,'2'):m(inside,3));
}
function answer(x){if(x.n!==null)return eq(x)+' = '+num(resultValue(x));
 if(isGeom)return eq(x)+' = '+(x.v.p===x.v.q?String(x.a):`${x.a}${grouped(x.v)}<sup>n − 1</sup>`);
 const b=add(rat(isSum?2*x.a:x.a),mul(rat(-1),x.v));
 return eq(x)+' = '+(isSum?frac(`n{${polynomial(x.v,b)}}`,'2'):polynomial(x.v,b));
}
function explanations(x){const n=x.n??'n';if(isGeom)return [
 `公比は負号や分数も含めた全体です。${x.v.p<0||x.v.q!==1?'全体を括弧で囲みます。':'正の整数なので括弧は省けます。'}`,
 `初項から第${n}項までは ${n}−1 回掛けるので、指数は ${n}−1 です。`,
 '指数は公比全体の右肩に書きます。初項まで一緒に累乗しません。',
 `最後に公比の累乗全体に初項 ${x.a} を掛けます。公比1なら、どの項も初項と同じです。`];
 if(isSum&&mode===1)return ['初項・末項・項数が与えられているので、Sₙ = n(a+l)/2 を使います。初項を a に代入します。', '与えられた末項を l に代入します。負の末項は負号も含めて括弧で囲みます。','初項と末項の和全体を括弧で囲みます。','その和に項数 n を掛け、全体を2で割ります。'];
 return [
 `公差を足す回数は項数より1少ないので、${n}−1 を括弧で囲みます。`,
 `公差は負号や分数を含む全体です。負の公差は (${(x.v.q===1?String(x.v.p):x.v.p+'/'+x.v.q)}) のように囲んで掛けます。`,
 '括弧で囲んだ「項数−1」全体に公差を掛けます。指数ではありません。',
 isSum?'2倍した初項と (n−1)d の和全体を中括弧で囲み、項数を掛けて2で割ります。':'公差の積に初項を足します。初項まで公差を掛けないようにします。'];}
function makeQuiz(x){const n=x.n??'n',nm=x.n===null?'n − 1':`${n} − 1`,v=grouped(x.v),candidates=[];
 function addBad(rhs,reason,value){candidates.push({html:eq(x)+' = '+rhs,reason,value})}
 if(isGeom){addBad(`${x.a} × ${v}<sup>${n}</sup>`,'指数が n になっています。公比を掛ける回数は n−1 です。',x.n===null?null:mul(rat(x.a),rat(x.v.p**x.n,x.v.q**x.n)));addBad(`(${x.a} × ${v})<sup>${nm}</sup>`,'初項まで累乗しています。累乗するのは公比全体だけです。',x.n===null?null:rat((x.a*x.v.p)**(x.n-1),x.v.q**(x.n-1)));addBad(`${x.a} + (${nm}) × ${v}`,'等差数列の公式になっています。等比数列では公比を繰り返し掛けます。',x.n===null?null:nth(x));}
 else if(isSum&&mode===1){let l=x.n===null?`${x.a}+(n−1)×${v}`:num(nth(x));addBad(`${frac(n,'2')} × ${x.a} + (${l})`,'初項と末項の和全体に n/2 を掛ける必要があります。',x.n===null?null:add(rat(x.n*x.a,2),nth(x)));addBad(`${n}{${x.a} + (${l})}`,'最後に2で割る操作が抜けています。',x.n===null?null:mul(resultValue(x),rat(2)));}
 else if(isSum){
 const w1=x.n===null?null:mul(rat(x.n,2),add(rat(2*x.a),mul(rat(x.n),x.v)));
 const w2=x.n===null?null:add(rat(x.n*x.a),mul(rat(x.n-1),x.v));
 addBad(frac(`${n}{2 × ${x.a} + ${n} × ${v}}`,'2'),'公差を足す回数が n になっています。正しくは n−1 です。',w1);
 addBad(`${frac(n,'2')} × 2 × ${x.a} + (${nm}) × ${v}`,'外側の括弧がないため、和全体に n/2 が掛かっていません。',w2);
 addBad(`${n}{2 × ${x.a} + (${nm}) × ${v}}`,'分母の2が抜けています。',x.n===null?null:mul(resultValue(x),rat(2)));
 }
 else{
 const w1=x.n===null?null:add(rat(x.a),mul(rat(x.n),x.v));
 const w2=x.n===null?null:mul(rat(x.a+x.n-1),x.v);
 const w3=x.n===null?null:add(rat(x.a+x.n),mul(rat(-1),x.v));
 addBad(`${x.a} + ${n} × ${v}`,'公差を足す回数が n になっています。正しくは n−1 です。',w1);
 addBad(`(${x.a} + ${nm}) × ${v}`,'初項まで公差を掛けています。公差を掛けるのは n−1 全体です。',w2);
 addBad(`${x.a} + ${n} − 1 × ${v}`,'n−1 の括弧がなく、1だけに公差が掛かっています。',w3);
 }
 const good=x.n===null?null:resultValue(x);
 let valid=candidates.filter(c=>!good||c.value.p*good.q!==good.p*c.value.q);
 // For zero common difference / ratio 1, use a guaranteed different expression.
 if((!isGeom&&x.v.p===0)||(isGeom&&x.v.p===x.v.q))valid=valid.filter(c=>!c.reason.includes('回数'));
 if(!valid.length)valid=[{html:eq(x)+' = 0',reason:'初項が正なので、この条件で全体が0になる式は正しくありません。'}];
 return {slot:Math.floor(Math.random()*2),bad:valid[Math.floor(Math.random()*valid.length)]};
}
for(const event of ['wheel','touchstart','pointerdown','keydown'])window.addEventListener(event,()=>inputRevision++,{passive:true});
function render(keep=true){const x=deck[position],n=x.n??'n',rev=++revision,ir=inputRevision,y=window.scrollY,main=$('main');if(keep)main.style.minHeight=main.getBoundingClientRect().height+'px';const restore=()=>{if(keep&&rev===revision&&ir===inputRevision)window.scrollTo({top:y,behavior:'instant'})};
 mode=isSum&&x.given==='last'?1:0;
 if(window.MathJax?.typesetClear)MathJax.typesetClear();
 $('title').textContent=meta.name+' ― 式の書き方';document.title=meta.name+' ― 数列の公式';
 $('counter').textContent=`${position+1} / ${deck.length}`;
 $('condition').innerHTML=`<span>初項 ${math(x.a)}</span><span>${isSum&&x.given==='last'?'末項':'公'+(isGeom?'比':'差')} ${math(num(isSum&&x.given==='last'?nth(x):x.v))}</span><span>${x.n===null?'第 n 項まで':`第 ${x.n} 項${isSum?'まで':''}`}${isSum?'の和':'の値'}</span>`;
 
 $('legend').textContent=isSum?(mode===1?'a：初項 ／ l：末項 ／ n：項数':'a：初項 ／ d：公差 ／ n：項数'):(isGeom?'a：初項 ／ r：公比 ／ n：項数':'a：初項 ／ d：公差 ／ n：項数');
 $('formula-reason').textContent=isSum?(mode===1?'初項・末項・項数が分かっているので、この公式を使います。':'初項・公差・項数が分かっているので、この公式を使います。'):'';
 $('formula').innerHTML=math(official());$('substitute').innerHTML=math(substitute(x));$('highlight').innerHTML=math(substitute(x,true));
 $('explanation').innerHTML=explanations(x).slice(0,focus+1).map((t,i)=>`<p>${i+1}. ${t}</p>`).join('');$('answer').innerHTML=math(answer(x));
 if(!choiceData)choiceData=makeQuiz(x);
 const choices=[];choices[choiceData.slot]=substitute(x);choices[1-choiceData.slot]=choiceData.bad.html;
 $('choices').innerHTML=choices.map((t,i)=>`<button type="button" class="quiz-choice" data-choice="${i}" aria-pressed="${selection===i}" ${selection!==null?'disabled':''}><span class="quiz-label">${i===0?'A':'B'}</span>${math(t)}</button>`).join('');
 $('choices').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selection=Number(b.dataset.choice);render()}));
 $('quiz-feedback').innerHTML=selection===null?'':`<strong>${selection===choiceData.slot?'正解です。':'もう一方が正解です。'} 正しい式は ${choiceData.slot===0?'A':'B'}。</strong><p>誤りの式：${choiceData.bad.reason}</p>`;
 for(let i=1;i<=4;i++)$('step'+i).hidden=stage<i;$('quiz').hidden=stage<3||focus<3;
 $('advance').disabled=stage===4;$('advance').textContent=stage===4?'解説完了':stage===3&&focus<3?`解説ポイント ${focus+2} を見る`:stage===3?'④ 答えを見る':'解説を進める';
 const pending=window.refreshTex();restore();requestAnimationFrame(restore);Promise.resolve(pending).finally(()=>{if(rev!==revision)return;main.style.minHeight='';restore();requestAnimationFrame(restore)});
}
$('advance').addEventListener('click',()=>{if(stage<3){stage++;focus=0}else if(focus<3)focus++;else stage=4;render()});
$('next').addEventListener('click',()=>{let prev=deck[position];position++;if(position===deck.length)newDeck(prev);stage=0;focus=0;selection=null;choiceData=null;render(false);$('problem').scrollIntoView({behavior:'smooth',block:'start'})});
    function htmlToTex(node){
      if(node.nodeType===3)return node.textContent.replace(/−/g,'-').replace(/[｛｝{}]/g,c=>(c==='｛'||c==='{')?'\\{':'\\}').replace(/×/g,'\\times ');
      if(node.nodeType!==1)return '';
      const children=()=>Array.from(node.childNodes).map(htmlToTex).join('');
      if(node.classList.contains('frac'))return '\\frac{'+htmlToTex(node.querySelector(':scope > .top'))+'}{'+htmlToTex(node.querySelector(':scope > .bottom'))+'}';
      if(node.tagName==='SUP')return '^{'+children()+'}';
      if(node.tagName==='SUB')return '_{'+children()+'}';
      const t=children();return node.classList.contains('active')?'\\bbox[5px,border:2px solid #e8aa41,#ffe49a]{'+t+'}':t;
    }
    let texQueue=Promise.resolve();
    window.refreshTex=function(){
      if(!window.texReady||!window.MathJax?.typesetPromise)return;
      const nodes=Array.from(document.querySelectorAll('.math')).filter(n=>!n.querySelector('mjx-container')&&!n.dataset.texQueued);
      nodes.forEach(n=>{n.dataset.texQueued='1';const t=htmlToTex(n);n.textContent='\\('+t+'\\)'});
      texQueue=texQueue.catch(()=>{}).then(()=>{const live=nodes.filter(n=>n.isConnected);return live.length?MathJax.typesetPromise(live):undefined}).catch(()=>{});
      return texQueue;
    };


render();
</script></body></html>
